apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  annotations:
    tanka.dev/namespaced: "false"
  labels:
    crossplane.io/xrd: xstacks.asserts.grafana.net.namespaced
  name: stack-namespaced
spec:
  compositeTypeRef:
    apiVersion: asserts.grafana.net.namespaced/v1alpha1
    kind: XStack
  mode: Pipeline
  pipeline:
    - functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - base:
              apiVersion: asserts.grafana.crossplane.io/v1alpha1
              kind: Stack
            name: stack
            patches:
              - fromFieldPath: spec.parameters.externalName
                toFieldPath: "metadata.annotations[\"crossplane.io/external-name\"]"
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.selectorLabel
                toFieldPath: "metadata.labels[\"selector\"]"
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.cloudAccessPolicyTokenSecretRef.key
                toFieldPath: spec.forProvider.cloudAccessPolicyTokenSecretRef.key
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.cloudAccessPolicyTokenSecretRef.name
                toFieldPath: spec.forProvider.cloudAccessPolicyTokenSecretRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.cloudAccessPolicyTokenSecretRef.namespace
                toFieldPath: spec.forProvider.cloudAccessPolicyTokenSecretRef.namespace
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.dataset
                toFieldPath: spec.forProvider.dataset
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.grafanaTokenSecretRef.key
                toFieldPath: spec.forProvider.grafanaTokenSecretRef.key
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.grafanaTokenSecretRef.name
                toFieldPath: spec.forProvider.grafanaTokenSecretRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.forProvider.grafanaTokenSecretRef.namespace
                toFieldPath: spec.forProvider.grafanaTokenSecretRef.namespace
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.cloudAccessPolicyTokenSecretRef.key
                toFieldPath: spec.initProvider.cloudAccessPolicyTokenSecretRef.key
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.cloudAccessPolicyTokenSecretRef.name
                toFieldPath: spec.initProvider.cloudAccessPolicyTokenSecretRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.cloudAccessPolicyTokenSecretRef.namespace
                toFieldPath: spec.initProvider.cloudAccessPolicyTokenSecretRef.namespace
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.dataset
                toFieldPath: spec.initProvider.dataset
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.grafanaTokenSecretRef.key
                toFieldPath: spec.initProvider.grafanaTokenSecretRef.key
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.grafanaTokenSecretRef.name
                toFieldPath: spec.initProvider.grafanaTokenSecretRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.initProvider.grafanaTokenSecretRef.namespace
                toFieldPath: spec.initProvider.grafanaTokenSecretRef.namespace
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.managementPolicies
                toFieldPath: spec.managementPolicies
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.providerConfigRef.name
                toFieldPath: spec.providerConfigRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.providerConfigRef.policy.resolution
                toFieldPath: spec.providerConfigRef.policy.resolution
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.providerConfigRef.policy.resolve
                toFieldPath: spec.providerConfigRef.policy.resolve
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.writeConnectionSecretToRef.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                type: FromCompositeFieldPath
              - fromFieldPath: spec.parameters.writeConnectionSecretToRef.namespace
                toFieldPath: spec.writeConnectionSecretToRef.namespace
                type: FromCompositeFieldPath
      step: patch-and-transform
    - functionRef:
        name: function-grafana-data
      step: grafana-data